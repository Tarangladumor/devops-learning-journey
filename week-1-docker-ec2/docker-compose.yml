# Compose file for a Next.js frontend + Node/Express backend behind Nginx.
# Place it next to the two app folders (./frontend and ./backend).
# Run with:  docker compose --env-file ./frontend/.env up -d --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: app-frontend
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env
        required: false
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: app-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
